<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Placement Predictor</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="page">

        <div class="header">
            <div class="icon">🎓</div>

            <h1>Student Placement Predictor</h1>

            <p>
                Enter your details to estimate
                your placement chances.
            </p>
        </div>


        <div class="form-card">

            <form action="/predict" method="POST">

                <div class="form-grid">

                    <!-- CGPA -->
                    <div class="form-group">
                        <label>CGPA</label>
                        <input
                            type="number"
                            name="cgpa"
                            step="0.01"
                            min="0"
                            max="10"
                            placeholder="e.g. 8.5"
                            required
                        >
                    </div>


                    <!-- Internships -->
                    <div class="form-group">
                        <label>Internships</label>
                        <input
                            type="number"
                            name="internship"
                            min="0"
                            placeholder="e.g. 2"
                            required
                        >
                    </div>


                    <!-- Projects -->
                    <div class="form-group">
                        <label>Projects</label>
                        <input
                            type="number"
                            name="project"
                            min="0"
                            placeholder="e.g. 3"
                            required
                        >
                    </div>


                    <!-- Workshops -->
                    <div class="form-group">
                        <label>Workshops / Certifications</label>
                        <input
                            type="number"
                            name="workshop"
                            min="0"
                            placeholder="e.g. 4"
                            required
                        >
                    </div>


                    <!-- Aptitude -->
                    <div class="form-group">
                        <label>Aptitude Test Score</label>
                        <input
                            type="number"
                            name="aptitude"
                            min="0"
                            max="100"
                            placeholder="Out of 100"
                            required
                        >
                    </div>


                    <!-- Soft Skills -->
                    <div class="form-group">
                        <label>Soft Skills Rating</label>
                        <input
                            type="number"
                            name="softskill"
                            step="0.1"
                            min="0"
                            max="5"
                            placeholder="Out of 5"
                            required
                        >
                    </div>


                    <!-- Extra Curricular -->
                    <div class="form-group">
                        <label>Extracurricular Activities</label>

                        <select name="extra" required>
                            <option value="1">Yes</option>
                            <option value="0">No</option>
                        </select>
                    </div>


                    <!-- Placement Training -->
                    <div class="form-group">
                        <label>Placement Training</label>

                        <select name="training" required>
                            <option value="1">Yes</option>
                            <option value="0">No</option>
                        </select>
                    </div>


                    <!-- SSC -->
                    <div class="form-group">
                        <label>SSC Marks</label>
                        <input
                            type="number"
                            name="ssc"
                            min="0"
                            max="100"
                            placeholder="Percentage"
                            required
                        >
                    </div>


                    <!-- HSC -->
                    <div class="form-group">
                        <label>HSC Marks</label>
                        <input
                            type="number"
                            name="hsc"
                            min="0"
                            max="100"
                            placeholder="Percentage"
                            required
                        >
                    </div>

                </div>


                <button type="submit" class="predict-btn">
                    Predict My Placement Chance
                    <span>→</span>
                </button>

            </form>

        </div>


        <div class="footer">
            <p>Powered by Machine Learning • Logistic Regression</p>
        </div>

    </div>

</body>
</html>
